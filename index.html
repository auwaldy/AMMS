<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMMS Service Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 15px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .calculator h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .soon {
      background: #fef3c7;
      color: #92400e;
    }

    .due {
      background: #fee2e2;
      color: #991b1b;
    }

    .remaining {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0;
    }

    footer {
      text-align: center;
      color: #777;
      margin-top: 30px;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AMMS</h1>
    <p>Auwal DY Maintenance Management System</p>
  </header>

  <div class="container">

    <div class="calculator">

      <h2>🧮 Service Calculator</h2>

      <label>Machine ID</label>

      <input
        type="text"
        id="machine"
        placeholder="Example: PC300-01"
      >

      <label>Current Hour</label>

      <input
        type="number"
        id="currentHour"
        placeholder="Example: 1450"
      >

      <label>Next Service Due</label>

      <input
        type="number"
        id="nextService"
        placeholder="Example: 1500"
      >

      <button onclick="calculateService()">
        Calculate Service
      </button>

      <div id="result">

        <div id="status"></div>

        <div
          id="remaining"
          class="remaining">
        </div>

        <div id="message"></div>

      </div>

    </div>

  </div>

  <footer>
    AMMS © Auwal DY
  </footer>


  <script>

    function calculateService() {

      const machine =
        document.getElementById("machine").value.trim();

      const current =
        Number(
          document.getElementById("currentHour").value
        );

      const next =
        Number(
          document.getElementById("nextService").value
        );

      const result =
        document.getElementById("result");

      const status =
        document.getElementById("status");

      const remaining =
        document.getElementById("remaining");

      const message =
        document.getElementById("message");


      if (!machine || isNaN(current) || isNaN(next)) {

        alert(
          "Please enter Machine ID, Current Hour and Next Service."
        );

        return;
      }


      const hoursLeft = next - current;


      result.style.display = "block";


      if (hoursLeft <= 0) {

        result.className = "due";

        status.innerHTML =
          "🔴 SERVICE DUE";

        remaining.innerHTML =
          Math.abs(hoursLeft) + " H OVERDUE";

        message.innerHTML =
          machine +
          " has reached or passed the service hour.";

      }

      else if (hoursLeft <= 50) {

        result.className = "soon";

        status.innerHTML =
          "🟡 SERVICE DUE SOON";

        remaining.innerHTML =
          hoursLeft + " H REMAINING";

        message.innerHTML =
          machine +
          " is approaching the service hour.";

      }

      else {

        result.className = "ok";

        status.innerHTML =
          "🟢 OK";

        remaining.innerHTML =
          hoursLeft + " H REMAINING";

        message.innerHTML =
          machine +
          " has enough hours before service.";

      }

    }

  </script>

</body>
</html>
